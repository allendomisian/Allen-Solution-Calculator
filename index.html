<!DOCTYPE html>
<html lang="sw">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLEN SOLUTION CALCULATOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            padding: 10px;
        }

        .calc {
            background: #16213e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 350px;
            border: 2px solid #0f3460;
        }

        .title {
            color: #e94560;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            height: 70px;
            font-size: 32px;
            text-align: right;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #0f3460;
            color: #fff;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px 10px;
            font-size: 22px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: #0f3460;
            color: white;
            transition: 0.2s active;
        }

        button:active {
            background: #e94560;
            transform: scale(0.95);
        }

        .btn-clear {
            background: #950740;
        }

        .btn-del {
            background: #c3073f;
        }

        .btn-op {
            background: #533483;
        }

        .equal {
            background: #e94560;
            grid-column: span 2;
            font-weight: bold;
        }

        @media (max-width: 320px) {
            button {
                padding: 15px 5px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="calc">
        <div class="title">ALLEN SOLUTION</div>
        <input type="text" id="screen" readonly>

        <div class="buttons">
            <button class="btn-clear" onclick="clearScreen()">C</button>
            <button class="btn-del" onclick="backspace()">DEL</button>
            <button class="btn-op" onclick="addToScreen('/')">/</button>
            <button class="btn-op" onclick="addToScreen('*')">×</button>

            <button onclick="addToScreen('7')">7</button>
            <button onclick="addToScreen('8')">8</button>
            <button onclick="addToScreen('9')">9</button>
            <button class="btn-op" onclick="addToScreen('-')">-</button>

            <button onclick="addToScreen('4')">4</button>
            <button onclick="addToScreen('5')">5</button>
            <button onclick="addToScreen('6')">6</button>
            <button class="btn-op" onclick="addToScreen('+')">+</button>

            <button onclick="addToScreen('1')">1</button>
            <button onclick="addToScreen('2')">2</button>
            <button onclick="addToScreen('3')">3</button>
            <button onclick="addToScreen('.')">.</button>

            <button onclick="addToScreen('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let screen = document.getElementById('screen');

        function addToScreen(value) {
            screen.value += value;
        }

        function clearScreen() {
            screen.value = '';
        }

        function backspace() {
            screen.value = screen.value.slice(0, -1);
        }

        function calculate() {
            try {
                if (screen.value !== "") {
                    screen.value = Function('"use strict";return (' + screen.value + ')')();
                }
            } catch (e) {
                screen.value = 'Error';
                setTimeout(clearScreen, 1500);
            }
        }
    </script>

</body>

</html>
